[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ranger-core"
version = "0.1.0"
description = "Ranger — Reliable Data Extraction & Loading Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Ranger Team" },
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "structlog>=23.0",
    "duckdb>=0.9",
    "orjson>=3.9",
    "pyarrow>=14.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Source connectors
relational = ["sqlalchemy>=2.0", "psycopg2-binary", "pymysql", "pyodbc"]
nosql = ["pymongo>=4.0", "boto3", "couchbase"]
kafka = ["confluent-kafka>=2.0"]
kinesis = ["boto3"]
pubsub = ["google-cloud-pubsub"]
sqs = ["boto3"]
rabbitmq = ["pika>=1.3"]
eventhubs = ["azure-eventhub"]
rest = ["httpx>=0.25"]
graphql = ["gql[httpx]>=3.0"]
grpc = ["grpcio>=1.50", "grpcio-tools"]
websocket = ["websockets>=12.0"]
sftp = ["paramiko>=3.0"]
mqtt = ["paho-mqtt>=1.6"]
elasticsearch = ["elasticsearch>=8.0"]
soap = ["zeep>=4.0"]
cdc = ["confluent-kafka>=2.0"]

# SaaS connectors
salesforce = ["simple-salesforce>=1.12"]
stripe = ["stripe>=7.0"]
hubspot = ["hubspot-api-client>=8.0"]
google-sheets = ["google-api-python-client>=2.0", "google-auth-oauthlib"]
sharepoint = ["Office365-REST-Python-Client>=2.5"]

# File formats
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
xml = ["lxml>=4.9"]
avro = ["fastavro>=1.8"]
orc = ["pyarrow>=14.0"]
geo = ["fiona>=1.9", "geopandas>=0.14"]
compression = ["zstandard>=0.22", "python-snappy>=0.6"]

# Sink connectors
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0"]
delta = ["deltalake>=0.14"]
iceberg = ["pyiceberg>=0.5"]

# Secret providers
vault = ["hvac>=2.0"]
aws-secrets = ["boto3"]
azure-keyvault = ["azure-keyvault-secrets>=4.0"]
gcp-secrets = ["google-cloud-secret-manager>=2.0"]

# Quality & PII
quality = ["presidio-analyzer>=2.0", "presidio-anonymizer>=2.0"]

# Observability
lineage = ["openlineage-python>=1.0"]

# All extras
all = [
    "ranger-core[relational,nosql,kafka,kinesis,pubsub,sqs,rabbitmq,eventhubs,rest,graphql,grpc,websocket,sftp,mqtt,elasticsearch,soap,cdc]",
    "ranger-core[salesforce,stripe,hubspot,google-sheets,sharepoint]",
    "ranger-core[excel,xml,avro,orc,geo,compression]",
    "ranger-core[snowflake,bigquery,delta,iceberg]",
    "ranger-core[vault,aws-secrets,azure-keyvault,gcp-secrets]",
    "ranger-core[quality,lineage]",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "testcontainers>=3.7",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.0",
]

[project.scripts]
ranger = "ranger.cli:app"

[project.entry-points."ranger.sources"]
relational = "ranger.sources.relational:RelationalSource"
mongodb = "ranger.sources.nosql:MongoDBSource"
dynamodb = "ranger.sources.nosql:DynamoDBSource"
kafka = "ranger.sources.kafka:KafkaSource"
kinesis = "ranger.sources.kinesis:KinesisSource"
pubsub = "ranger.sources.pubsub:PubSubSource"
sqs = "ranger.sources.sqs:SQSSource"
rabbitmq = "ranger.sources.rabbitmq:RabbitMQSource"
event_hubs = "ranger.sources.event_hubs:EventHubsSource"
rest_api = "ranger.sources.rest_api:RestAPISource"
graphql = "ranger.sources.graphql:GraphQLSource"
grpc = "ranger.sources.grpc_source:GRPCSource"
websocket = "ranger.sources.websocket:WebSocketSource"
sftp = "ranger.sources.sftp:SFTPSource"
mqtt = "ranger.sources.mqtt:MQTTSource"
elasticsearch = "ranger.sources.elasticsearch:ElasticsearchSource"
soap = "ranger.sources.soap:SOAPSource"
file = "ranger.sources.file_source:FileSource"
cdc = "ranger.sources.cdc:DebeziumCDCSource"
delta_lake = "ranger.sources.delta_source:DeltaLakeSource"
iceberg = "ranger.sources.iceberg_source:IcebergSource"

[project.entry-points."ranger.engines"]
batch = "ranger.engines.batch:BatchEngine"
stream = "ranger.engines.stream:StreamEngine"
event = "ranger.engines.event:EventEngine"

[project.entry-points."ranger.sinks"]
local = "ranger.sinks.local:LocalSink"
s3 = "ranger.sinks.s3:S3Sink"
gcs = "ranger.sinks.gcs:GCSSink"
adls = "ranger.sinks.adls:ADLSSink"
snowflake = "ranger.sinks.snowflake:SnowflakeSink"
bigquery = "ranger.sinks.bigquery:BigQuerySink"
delta = "ranger.sinks.delta:DeltaLakeSink"
iceberg = "ranger.sinks.iceberg:IcebergSink"
postgresql = "ranger.sinks.relational_sink:PostgreSQLSink"
mysql = "ranger.sinks.relational_sink:MySQLSink"
elasticsearch = "ranger.sinks.elasticsearch_sink:ElasticsearchSink"
webhook = "ranger.sinks.webhook_sink:WebhookSink"
kafka_producer = "ranger.sinks.kafka_producer:KafkaProducerSink"
sqs = "ranger.sinks.sqs_sink:SQSSink"
rabbitmq = "ranger.sinks.rabbitmq_sink:RabbitMQSink"
mongodb = "ranger.sinks.mongodb_sink:MongoDBSink"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
