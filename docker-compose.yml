# =============================================================================
# Ranger Development Stack
# =============================================================================
# Provides Ranger + backing services for all source connectors:
#   - PostgreSQL  (relational source)
#   - MongoDB     (nosql source)
#   - Elasticsearch + Kibana (elasticsearch source)
#   - Kafka + Zookeeper + Debezium Connect (CDC source)
#   - DynamoDB Local (nosql source — DynamoDB)
#
# Usage:
#   docker compose up -d            # start everything
#   docker compose up ranger        # just Ranger + deps it needs
#   docker compose run ranger run --config /app/configs/example_pipeline.yaml
#   docker compose down -v          # tear down + remove volumes
# =============================================================================

x-common-env: &common-env
  TZ: America/Chicago

services:
  # -----------------------------------------------------------------------
  # Ranger application
  # -----------------------------------------------------------------------
  ranger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranger
    environment:
      <<: *common-env
      RANGER_METADATA_DB: /app/metadata/ranger_meta.duckdb
      # Connection details for backing services (used in pipeline YAMLs)
      POSTGRES_URL: "postgresql+psycopg2://ranger:ranger@postgres:5432/ranger_dev"
      MONGODB_URL: "mongodb://ranger:ranger@mongodb:27017/ranger_dev?authSource=admin"
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      KAFKA_BOOTSTRAP: "kafka:29092"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ranger-metadata:/app/metadata
      - ranger-output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - ranger-net
    # Override entrypoint to keep the container running for interactive use
    entrypoint: ["sleep", "infinity"]

  # -----------------------------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ranger-postgres
    environment:
      POSTGRES_USER: ranger
      POSTGRES_PASSWORD: ranger
      POSTGRES_DB: ranger_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger -d ranger_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # MongoDB
  # -----------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: ranger-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ranger
      MONGO_INITDB_ROOT_PASSWORD: ranger
      MONGO_INITDB_DATABASE: ranger_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # Elasticsearch
  # -----------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: ranger-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # Zookeeper (Kafka dependency)
  # -----------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ranger-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # Kafka
  # -----------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ranger-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # Debezium Kafka Connect (CDC)
  # -----------------------------------------------------------------------
  debezium:
    image: debezium/connect:2.5
    container_name: ranger-debezium
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: ranger-debezium
      BOOTSTRAP_SERVERS: kafka:29092
      CONFIG_STORAGE_TOPIC: _debezium_configs
      OFFSET_STORAGE_TOPIC: _debezium_offsets
      STATUS_STORAGE_TOPIC: _debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - ranger-net

  # -----------------------------------------------------------------------
  # DynamoDB Local
  # -----------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ranger-dynamodb
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - ranger-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  mongo-data:
  es-data:
  ranger-metadata:
  ranger-output:

# =============================================================================
# Network
# =============================================================================
networks:
  ranger-net:
    driver: bridge
